name: Deploy Netlify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy production
        if: github.event_name == 'push'
        run: npx --yes netlify-cli@27.12.0 deploy --prod --message "${{ github.sha }}"

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          npx --yes netlify-cli@27.12.0 deploy --alias "pr-${{ github.event.pull_request.number }}" --json > deploy.json
          echo "url=$(grep -o '"deploy_url": *"[^"]*"' deploy.json | tail -1 | cut -d'"' -f4)" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- netlify-preview -->';
            const body = `${marker}\nPreview Netlify : ${{ steps.preview.outputs.url }}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
