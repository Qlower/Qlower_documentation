<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Connexion · Documentation Qlower</title>
    <link rel="icon" href="/img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        const stored = localStorage.getItem("theme");
        const dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {}
    </script>
    <style>
      :root {
        --primary: #3f55c8;
        --primary-hover: #2d3f9e;
        --background: #ffffff;
        --foreground: #1c1e21;
        --muted: #606770;
        --border: #dadde1;
        --danger-background: #ffebec;
        --danger-border: #e13238;
        --danger-foreground: #4b1113;
        --card-shadow: 0 24px 32px rgba(63, 85, 200, 0.12);
      }
      :root[data-theme="dark"] {
        --primary: #5a6dd4;
        --primary-hover: #6a7dd8;
        --background: #1b1b1d;
        --foreground: #e3e3e3;
        --muted: #a8adb3;
        --border: #444950;
        --danger-background: rgba(225, 50, 56, 0.15);
        --danger-foreground: #ffb3b5;
        --card-shadow: 0 24px 40px rgba(0, 0, 0, 0.45);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: calc(32px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
        background: var(--background);
        color: var(--foreground);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .illustration { display: none; width: 826px; margin-right: -100px; }
      .logo { height: 40px; }
      .manrope { font-family: Manrope, sans-serif; }
      main { width: 100%; max-width: 28rem; padding: 24px 20px; }
      h1 { margin: 0; text-align: center; font-size: 1.25rem; line-height: 1.4; font-weight: 700; }
      .subtitle { margin: 8px 0 20px; text-align: center; font-size: 0.875rem; color: var(--muted); }
      form { display: flex; flex-direction: column; gap: 12px; }
      label { display: block; margin-bottom: 4px; font-size: 0.875rem; font-weight: 500; color: var(--primary); }
      .field { position: relative; }
      input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        font: inherit;
        font-size: 0.875rem;
        color: var(--foreground);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6.4px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input:focus-visible {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent);
      }
      #password { padding-right: 44px; }
      .toggle {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        padding: 4px;
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      .toggle:hover { color: var(--primary); }
      .toggle [hidden] { display: none; }
      .error {
        margin: 0;
        padding: 10px 14px;
        font-size: 0.875rem;
        color: var(--danger-foreground);
        background: var(--danger-background);
        border-left: 4px solid var(--danger-border);
        border-radius: 6.4px;
      }
      button[type="submit"] {
        width: 100%;
        height: 40px;
        margin-top: 8px;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        color: #ffffff;
        background: var(--primary);
        border: 0;
        border-radius: 6.4px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        cursor: pointer;
        transition: background 0.15s;
      }
      button[type="submit"]:hover { background: var(--primary-hover); }
      button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }
      footer { font-size: 0.8rem; color: var(--muted); }
      @media (min-width: 1024px) {
        body { flex-direction: row; gap: 0; }
        .illustration { display: block; }
        .logo, footer { display: none; }
        main { margin-left: -100px; position: relative; }
      }
      @media (min-width: 640px) {
        main {
          max-width: none;
          width: auto;
          padding: 60px 100px;
          background: var(--background);
          border-radius: 16px;
          box-shadow: var(--card-shadow);
        }
        form { width: 340px; gap: 16px; }
        h1 { font-size: 2.25rem; line-height: 1.1; }
        .subtitle { margin: 24px 0 48px; font-size: 1.25rem; }
        button[type="submit"] { width: 276px; margin: 20px auto 0; }
      }
    </style>
  </head>
  <body>
    <img class="illustration" src="/img/login-illustration.svg" alt="" />
    <img class="logo" src="/img/logo-qlower.svg" alt="Qlower" />
    <main>
      <h1 class="manrope">Connectez-vous</h1>
      <p class="subtitle manrope">Accédez à la documentation Qlower</p>
      <form id="login" novalidate>
        <div>
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div>
          <label for="password">Mot de passe</label>
          <div class="field">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button class="toggle" type="button" aria-label="Afficher le mot de passe" aria-pressed="false"><svg class="eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.2 3.2M6.6 6.6C3.7 8.5 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg></button>
          </div>
        </div>
        <p class="error" id="error" role="alert" hidden></p>
        <button type="submit">Se connecter</button>
      </form>
    </main>
    <footer id="copyright"></footer>
    <script>
      const MESSAGES = {
        DOC_ACCESS_DENIED: "E-mail ou mot de passe incorrect, ou accès à la documentation non autorisé.",
        DOC_ACCESS_RATE_LIMITED: "Trop de tentatives. Réessayez plus tard.",
        DOC_ACCESS_DISABLED: "La connexion à la documentation est momentanément indisponible.",
        DOC_ACCESS_BAD_REQUEST: "Requête invalide. Rechargez la page et réessayez.",
      };
      document.getElementById("copyright").textContent = `Copyright © ${new Date().getFullYear()} Qlower, Inc.`;
      const form = document.getElementById("login");
      const error = document.getElementById("error");
      const password = form.password;
      const toggle = form.querySelector(".toggle");
      toggle.addEventListener("click", () => {
        const show = password.type === "password";
        password.type = show ? "text" : "password";
        toggle.querySelector(".eye").hidden = show;
        toggle.querySelector(".eye-off").hidden = !show;
        toggle.setAttribute("aria-label", show ? "Masquer le mot de passe" : "Afficher le mot de passe");
        toggle.setAttribute("aria-pressed", String(show));
      });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        error.hidden = true;
        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: form.email.value, password: password.value }),
          });
          if (response.ok) {
            const next = new URL(new URLSearchParams(location.search).get("next") || "/", location.origin);
            location.replace(next.origin === location.origin ? next.href : "/");
            return;
          }
          const { error: code } = await response.json().catch(() => ({}));
          error.textContent = MESSAGES[code] || MESSAGES.DOC_ACCESS_DISABLED;
          error.hidden = false;
        } catch {
          error.textContent = MESSAGES.DOC_ACCESS_DISABLED;
          error.hidden = false;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
