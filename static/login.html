<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Connexion · Documentation Qlower</title>
    <link rel="icon" href="/img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        const stored = localStorage.getItem("theme");
        const dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {}
    </script>
    <style>
      :root {
        --primary: #3f55c8;
        --primary-hover: #2d3f9e;
        --page: #f4f5fb;
        --card: #ffffff;
        --foreground: #1c1e21;
        --muted: #606770;
        --border: #e3e5ec;
        --danger-background: #ffebec;
        --danger-border: #e13238;
        --danger-foreground: #4b1113;
        --card-shadow: 0 1px 2px rgba(16, 24, 64, 0.04), 0 12px 32px rgba(63, 85, 200, 0.08);
      }
      :root[data-theme="dark"] {
        --primary: #5a6dd4;
        --primary-hover: #6a7dd8;
        --page: #141416;
        --card: #1e1e21;
        --foreground: #e3e3e3;
        --muted: #a8adb3;
        --border: #34363c;
        --danger-background: rgba(225, 50, 56, 0.15);
        --danger-foreground: #ffb3b5;
        --card-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: calc(32px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
        background: radial-gradient(ellipse 80% 50% at 50% 0%, color-mix(in srgb, var(--primary) 10%, transparent), transparent), var(--page);
        color: var(--foreground);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 400px;
        padding: 40px 32px 32px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--card-shadow);
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
      .brand img { height: 32px; }
      .brand span { font-family: Manrope, sans-serif; font-weight: 700; font-size: 1.05rem; }
      .brand small { font-weight: 500; color: var(--muted); }
      h1 { margin: 0; font-family: Manrope, sans-serif; font-size: 1.5rem; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; }
      .subtitle { margin: 8px 0 28px; font-size: 0.9rem; color: var(--muted); }
      form { display: flex; flex-direction: column; gap: 16px; }
      label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; }
      .field { position: relative; }
      input {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        font: inherit;
        font-size: 0.9rem;
        color: var(--foreground);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      input:focus-visible {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent);
      }
      #password { padding-right: 44px; }
      .toggle {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        padding: 4px;
        color: var(--muted);
        background: none;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      .toggle:hover { color: var(--primary); }
      .toggle [hidden] { display: none; }
      .error {
        margin: 0;
        padding: 10px 14px;
        font-size: 0.85rem;
        color: var(--danger-foreground);
        background: var(--danger-background);
        border-left: 4px solid var(--danger-border);
        border-radius: 8px;
      }
      button[type="submit"] {
        height: 44px;
        margin-top: 8px;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        color: #ffffff;
        background: var(--primary);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s;
      }
      button[type="submit"]:hover { background: var(--primary-hover); }
      button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }
      .help { margin: 24px 0 0; padding-top: 20px; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--muted); text-align: center; }
      footer { font-size: 0.8rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="/img/logo-qlower.svg" alt="" /><span>Qlower <small>Documentation</small></span></div>
      <h1>Connexion</h1>
      <p class="subtitle">Accédez à la documentation des connecteurs.</p>
      <form id="login" novalidate>
        <div>
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div>
          <label for="password">Mot de passe</label>
          <div class="field">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button class="toggle" type="button" aria-label="Afficher le mot de passe" aria-pressed="false"><svg class="eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.2 3.2M6.6 6.6C3.7 8.5 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg></button>
          </div>
        </div>
        <p class="error" id="error" role="alert" hidden></p>
        <button type="submit">Se connecter</button>
      </form>
      <p class="help">Pas encore d'accès ou mot de passe perdu ? Contactez votre interlocuteur Qlower.</p>
    </main>
    <footer id="copyright"></footer>
    <script>
      const MESSAGES = {
        DOC_ACCESS_DENIED: "E-mail ou mot de passe incorrect, ou accès à la documentation non autorisé.",
        DOC_ACCESS_RATE_LIMITED: "Trop de tentatives. Réessayez plus tard.",
        DOC_ACCESS_DISABLED: "La connexion à la documentation est momentanément indisponible.",
      };
      document.getElementById("copyright").textContent = `Copyright © ${new Date().getFullYear()} Qlower, Inc.`;
      const form = document.getElementById("login");
      const error = document.getElementById("error");
      const password = form.password;
      const toggle = form.querySelector(".toggle");
      toggle.addEventListener("click", () => {
        const show = password.type === "password";
        password.type = show ? "text" : "password";
        toggle.querySelector(".eye").hidden = show;
        toggle.querySelector(".eye-off").hidden = !show;
        toggle.setAttribute("aria-label", show ? "Masquer le mot de passe" : "Afficher le mot de passe");
        toggle.setAttribute("aria-pressed", String(show));
      });
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        error.hidden = true;
        try {
          const response = await fetch("/api/admin/partners/doc-access/login/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: form.email.value, password: password.value }),
          });
          if (response.ok) {
            const next = new URL(new URLSearchParams(location.search).get("next") || "/", location.origin);
            location.replace(next.origin === location.origin ? next.href : "/");
            return;
          }
          const { errors } = await response.json().catch(() => ({}));
          error.textContent = MESSAGES[errors?.[0]] || MESSAGES.DOC_ACCESS_DISABLED;
          error.hidden = false;
        } catch {
          error.textContent = MESSAGES.DOC_ACCESS_DISABLED;
          error.hidden = false;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
